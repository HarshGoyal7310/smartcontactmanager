<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/CSS/home.css}">

    <title th:text="${title}">User Dashboard - Smart Contact Manager</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <!-- Sidebar Toggle Icon -->
    <span onclick="toggleSidebar()" class="text-white mr-3" style="cursor: pointer; font-size: 20px;">
        <i class="fa-solid fa-bars"></i>
    </span>

    <a class="navbar-brand font-weight-bold" th:href="@{/user/index}">
        <i class="fa-solid fa-address-book mr-2"></i>Smart Contact Manager
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto text-uppercase">
            <li class="nav-item">
                <a class="nav-link font-weight-bold text-white" th:href="@{/user/index}">
                    <i class="fa-solid fa-user mr-1"></i>
                    <span th:text="${user != null ? user.name : 'User'}"></span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" th:href="@{/logout}">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i>Logout
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- Sidebar -->
<div class="sidebar">
    <a th:href="@{/user/index}"><i class="fa-solid fa-house mr-2"></i>Home</a>
    <a th:href="@{/user/show-contacts/0}"><i class="fa-solid fa-id-card-clip mr-2"></i>View Contacts</a>
    <a th:href="@{/user/add-contact}"><i class="fa-solid fa-user-plus mr-2"></i>Add Contact</a>
    <a th:href="@{/user/Profile}"><i class="fa-solid fa-circle-user mr-2"></i>Your Profile</a>
    <div class="divider"></div>
    <a th:href="@{/logout}"><i class="fa-solid fa-right-from-bracket mr-2"></i>Logout</a>
</div>

<!-- Main Content Area -->
<div class="content mt-5 pt-3">

    <!-- Flash Message Container -->
    <div th:if="${session.message}" class="container">
        <div th:classappend="${'alert-' + session.message.type}" class="alert alert-dismissible fade show text-center" role="alert">
            <span th:text="${session.message.content}"></span>
            <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
        </div>
    </div>

    <!-- Dynamic Section Injected Here -->
    <div th:replace="${content}"></div>

</div>

<!-- JavaScripts -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/JS/home.js}"></script>
<!-- JavaScripts (normal/base.html ke bottom me) -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>

<!--&lt;!&ndash; ✅ SweetAlert2 CDN-->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:src="@{/JS/home.js}"></script>
</body>
</html>
