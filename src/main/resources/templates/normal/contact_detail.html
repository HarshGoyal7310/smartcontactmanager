<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="normal/base :: layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>Contact Detail</title>
</head>
<body>

<section>
    <div class="card mr-3 ml-3 shadow-sm border-0" th:if="${contact}">
        <div class="card-body">
            <div class="container text-center">

                <!-- Contact Photo -->
                <img style="height: 160px; width: 160px; object-fit: cover;"
                     class="my_profile_picture border rounded-circle shadow-sm"
                     th:src="@{'/images/' + ${contact.image}}"
                     src="/images/contact.png"
                     alt="Contact Picture">

                <h3 class="mt-3 font-weight-bold">
                    <span th:text="${contact.name}"></span>
                    <small class="text-muted" th:if="${contact.secondName != null and !contact.secondName.isEmpty()}"
                           th:text="${'(' + contact.secondName + ')'}"></small>
                </h3>
                <p class="text-secondary" th:text="${contact.work != null and !contact.work.isEmpty() ? contact.work : 'Professional'}"></p>

                <!-- Quick Smart Action Buttons (All 4 aligned) -->
                <div class="mb-4">
                    <a th:href="@{'tel:' + ${contact.phone}}" class="btn btn-outline-success mr-2 mb-2">
                        <i class="fa-solid fa-phone mr-1"></i> Call
                    </a>
                    <a th:href="@{'https://wa.me/' + ${contact.phone}}" target="_blank" class="btn btn-success mr-2 mb-2">
                        <i class="fa-brands fa-whatsapp mr-1"></i> WhatsApp
                    </a>
                    <a th:href="@{'mailto:' + ${contact.email}}" class="btn btn-outline-primary mr-2 mb-2">
                        <i class="fa-solid fa-envelope mr-1"></i> Email
                    </a>
                    <button type="button" class="btn btn-dark mb-2" data-toggle="modal" data-target="#qrModal">
                        <i class="fa-solid fa-qrcode mr-1"></i> Share QR
                    </button>
                </div>

                <!-- Detailed Table -->
                <div class="table-responsive col-md-8 offset-md-2">
                    <table class="table table-bordered text-left">
                        <tbody>
                        <tr>
                            <th scope="row" style="width: 30%;">Contact ID</th>
                            <td><strong th:text="${'SCMUSER' + contact.cId}"></strong></td>
                        </tr>
                        <tr>
                            <th scope="row">Email Address</th>
                            <td><span th:text="${contact.email}"></span></td>
                        </tr>
                        <tr>
                            <th scope="row">Phone Number</th>
                            <td><span th:text="${contact.phone}"></span></td>
                        </tr>
                        <tr>
                            <th scope="row">Work / Profession</th>
                            <td><span th:text="${contact.work != null ? contact.work : 'N/A'}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Description / Bio -->
                <div class="description mt-3 col-md-8 offset-md-2 text-left bg-light p-3 rounded border">
                    <h6 class="font-weight-bold">About Contact:</h6>
                    <p class="text-muted" th:text="${contact.description != null and !contact.description.isEmpty() ? contact.description : 'No additional description provided.'}"></p>
                </div>

                <!-- Actions -->
                <div class="container mt-4">
                    <form th:action="@{'/user/update-contact/' + ${contact.cId}}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-primary px-4 mr-2">
                            <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
                        </button>
                    </form>
                    <a href="#" th:onclick="|deleteContact(${contact.cId})|" class="btn btn-danger px-4 text-white">
                        <i class="fa-solid fa-trash mr-1"></i> Delete
                    </a>
                </div>

            </div>
        </div>
    </div>

    <!-- Error message if contact not found -->
    <h3 th:unless="${contact}" class="text-center bg-danger p-3 text-white mt-4">
        You are not authorized to view this contact !!
    </h3>

    <!-- QR Code Modal -->
    <div class="modal fade" id="qrModal" tabindex="-1" role="dialog" aria-labelledby="qrModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content text-center p-4">
                <h4 class="font-weight-bold mb-2">Scan to Save Contact</h4>
                <p class="text-muted">Scan with any phone camera to add directly to Phonebook</p>

                <div id="qrcode" class="d-flex justify-content-center my-3"></div>

                <p class="font-weight-bold mb-0" th:if="${contact}" th:text="${contact.name}"></p>
                <p class="text-muted" th:if="${contact}" th:text="${contact.phone}"></p>

                <button type="button" class="btn btn-secondary mt-2" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>

    <!-- QR Code Generator Library & Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <th:block th:if="${contact}">
        <script th:inline="javascript">
            /*<![CDATA[*/
            document.addEventListener("DOMContentLoaded", function () {
                const name = /*[[${contact.name}]]*/ '';
                const phone = /*[[${contact.phone}]]*/ '';
                const email = /*[[${contact.email}]]*/ '';
                const work = /*[[${contact.work}]]*/ '';

                // Strict vCard 3.0 Format with CRLF (\r\n) for Native Phone Contacts Auto-fill
                let vcard = "BEGIN:VCARD\r\n";
                vcard += "VERSION:3.0\r\n";
                vcard += "N:" + name + ";;;;\r\n";
                vcard += "FN:" + name + "\r\n";
                if (phone) {
                    vcard += "TEL;TYPE=CELL:" + phone.trim() + "\r\n";
                }
                if (email) {
                    vcard += "EMAIL;TYPE=INTERNET:" + email.trim() + "\r\n";
                }
                if (work) {
                    vcard += "TITLE:" + work.trim() + "\r\n";
                    vcard += "ORG:" + work.trim() + "\r\n";
                }
                vcard += "END:VCARD";

                // Generate QR Code
                new QRCode(document.getElementById("qrcode"), {
                    text: vcard,
                    width: 220,
                    height: 220,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            });
            /*]]>*/
        </script>
    </th:block>

</section>

</body>
</html>
