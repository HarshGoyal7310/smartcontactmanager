<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="normal/base :: layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>Update Contact</title>
</head>
<body>

<section>
    <div class="card mr-3 ml-3 shadow-sm border-0">
        <div class="card-body">
            <h2 class="text-center font-weight-bold mb-4">
                <i class="fa-solid fa-pen-to-square text-primary mr-2"></i>Update Contact
            </h2>

            <div class="container-fluid mt-1">
                <div class="row">
                    <div class="col-md-10 offset-md-1">

                        <form th:action="@{/user/process-update}"
                              method="post"
                              th:object="${contact}"
                              enctype="multipart/form-data">

                            <!-- Hidden Contact ID -->
                            <input type="hidden" th:value="${contact.cId}" name="cId" />

                            <!-- First Name -->
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                </div>
                                <input type="text" id="name" name="name" th:value="${contact.name}"
                                       class="form-control" required/>
                            </div>

                            <!-- Nick Name -->
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-user-tag"></i></span>
                                </div>
                                <input type="text" id="secondName" name="secondName" th:value="${contact.secondName}"
                                       class="form-control"/>
                            </div>

                            <!-- Phone -->
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                </div>
                                <input type="number" id="phone" name="phone" th:value="${contact.phone}"
                                       class="form-control" required/>
                            </div>

                            <!-- Email -->
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                </div>
                                <input type="email" id="email" name="email" th:value="${contact.email}"
                                       class="form-control" required/>
                            </div>

                            <!-- Work -->
                            <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa-solid fa-briefcase"></i></span>
                                </div>
                                <input type="text" id="work" name="work" th:value="${contact.work}"
                                       class="form-control"/>
                            </div>

                            <!-- Description -->
                            <div class="form-group mb-3">
                                <textarea name="description" id="description" class="form-control"
                                          rows="5" th:text="${contact.description}"></textarea>
                            </div>

                            <!-- Image Preview & Upload -->
                            <div class="container text-center mb-3">
                                <img style="width: 100px; height: 100px; object-fit: cover;"
                                     class="my_profile_picture rounded-circle border"
                                     th:src="@{'/images/' + ${contact.image}}"
                                     alt="Current Image">
                                <p class="text-muted mt-1"><small>Current Picture</small></p>
                            </div>

                            <div class="custom-file mb-4">
                                <input type="file" name="imageFile" class="form-control-file" id="imageFile">
                                <small class="form-text text-muted">Upload new image if you want to replace the current one</small>
                            </div>

                            <!-- Submit -->
                            <div class="container text-center">
                                <button type="submit" class="btn btn-primary px-4 mr-2">Update Contact</button>
                                <a th:href="@{'/user/contact/' + ${contact.cId}}" class="btn btn-secondary px-4">Cancel</a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

</body>
</html>
