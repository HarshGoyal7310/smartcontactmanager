<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="normal/base :: layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>

<section>
    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center p-5">
                <img style="width: 140px; height: 140px; object-fit: cover;"
                     class="my_profile_picture border rounded-circle shadow-sm"
                     th:src="@{'/images/' + ${user.imageUrl}}"
                     src="/images/default.png"
                     alt="Profile Picture">

                <h2 class="font-weight-bold mt-3">
                    Welcome, <span th:text="${user.name}"></span>!
                </h2>
                <p class="text-secondary" th:text="${user.email}"></p>

                <p class="mt-3 text-muted mx-auto" style="max-width: 600px;"
                   th:text="${user.about != null and !user.about.isEmpty() ? user.about : 'Start adding your personal and business contacts securely on cloud.'}">
                </p>

                <div class="mt-4">
                    <a th:href="@{/user/add-contact}" class="btn btn-primary btn-lg px-4 mr-2 mb-2">
                        <i class="fa-solid fa-user-plus mr-1"></i> Add New Contact
                    </a>
                    <a th:href="@{/user/show-contacts/0}" class="btn btn-outline-primary btn-lg px-4 mb-2">
                        <i class="fa-solid fa-address-book mr-1"></i> View Contacts
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
